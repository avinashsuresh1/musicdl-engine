<div class="left-section">
  <button class="btn" id="btn-toggle-sidebar" title="Toggle Explorer Sidebar (Ctrl+B)"><span class="btn-icon">📁</span><span class="btn-text">Explorer</span></button>
  <div class="logo">
    <div class="playback-indicator"></div>
    <span class="logo-text">MusicDL</span>
  </div>
  <div class="project-title" id="project-title" title="Composition Title" data-title="Composition Title">Loading...</div>
  
  <button class="btn" id="btn-open" title="Open Project Folder"><span class="btn-icon">📂</span><span class="btn-text">Open</span></button>
  <button class="btn" id="btn-new" title="New Composition"><span class="btn-icon">➕</span><span class="btn-text">New</span></button>
  <button class="btn" id="btn-save" title="Save File Changes"><span class="btn-icon">💾</span><span class="btn-text">Save</span></button>
  <button class="btn btn-primary" id="btn-demo" title="Load Demo Project"><span class="btn-icon">🧪</span><span class="btn-text">Demo</span></button>
  <button class="btn" id="btn-help" title="Help & YAML Specification"><span class="btn-icon">❓</span><span class="btn-text">Help</span></button>
</div>

<div class="center-section">
  <div class="transport-group">
    <button class="t-btn" id="btn-play" title="Run / Pause Project (Space)"><span class="t-icon">▶</span><span class="t-text">Run</span></button>
    <button class="t-btn" id="btn-stop" title="Stop Playback"><span class="t-icon">⏹</span><span class="t-text">Stop</span></button>
    <button class="t-btn btn-flask" id="btn-test" title="Test Active File (Alt+T)"><span class="t-icon">🧪</span><span class="t-text">Test</span></button>
  </div>
  <div class="time-display" title="Timeline Beat Counter">001.1.00</div>
</div>

<div class="right-section">
  <div class="input-group" title="Tempo in Beats Per Minute (BPM)">
    <label for="input-bpm">BPM</label>
    <input type="number" id="input-bpm" min="10" max="300" value="90">
  </div>
  
  <div class="input-group" title="Root Frequency in Hertz (Hz)">
    <label for="input-root">Root</label>
    <input type="number" id="input-root" step="0.01" min="20" max="2000" value="261.63">
  </div>

  <div class="input-group" title="Step Interval size in Cents (100 cents = 1 semitone)">
    <label for="input-interval">Step</label>
    <input type="number" id="input-interval" min="1" max="1200" value="100">
  </div>
</div>
